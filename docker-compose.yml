version: '3.8'

services:
  app:
    build: .
    container_name: construccionesguerrero
    restart: unless-stopped
    ports:
      - "127.0.0.1:3014:80"
    networks:
      - proxy-network

  api:
    build: ./api
    container_name: construccionesguerrero-api
    restart: unless-stopped
    environment:
      - PORT=3026
      - DATA_DIR=/data
    volumes:
      - construcciones_leads:/data
    networks:
      - proxy-network

volumes:
  construcciones_leads:

networks:
  proxy-network:
    external: true
